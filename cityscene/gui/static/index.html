<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XP12 City Scenery</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<aside id="panel">
  <header>
    <div class="title-row">
      <h1 data-i18n="title">XP12 City Scenery</h1>
      <div id="lang" role="group" aria-label="Language">
        <button data-lang="en">EN</button><button data-lang="zh">中文</button>
      </div>
    </div>
    <p class="sub" data-i18n="subtitle"></p>
  </header>

  <details id="settings-box">
    <summary><span data-i18n="settings"></span> <span id="settings-flag"></span></summary>
    <label><span data-i18n="xplaneDir"></span><input id="xplane-root" placeholder="E:/SteamLibrary/steamapps/common/X-Plane 12"></label>
    <label>DSFTool.exe<input id="dsftool" placeholder="D:/xptools/tools/DSFTool.exe"></label>
    <button id="save-settings" data-i18n="save"></button>
    <p class="hint" data-i18n="dsftoolHint"></p>
  </details>

  <section>
    <h2 data-i18n="s1"></h2>
    <div class="row">
      <input id="search" data-i18n-placeholder="searchPh">
    </div>
    <p class="hint" data-i18n="drawHint"></p>
    <p id="area"></p>
    <button id="clear-zone" class="ghost" data-i18n="clearZone"></button>
  </section>

  <section>
    <h2 data-i18n="s2"></h2>
    <label><span data-i18n="jobName"></span><input id="job-name" placeholder="sydney_cbd"></label>
    <label><span data-i18n="sceneryName"></span><input id="scenery-name" placeholder="CityScene_sydney_cbd"></label>
    <label><span data-i18n="defaultHeight"></span><input id="default-height" type="number" min="3" max="100" step="1"></label>
    <label><span data-i18n="renderDistance"></span><input id="render-distance" type="number" min="5" max="100" step="1"></label>
    <p class="hint" data-i18n="renderDistanceHint"></p>
    <label class="check"><input id="force-fetch" type="checkbox"> <span data-i18n="forceFetch"></span></label>
    <button id="build" class="primary" data-i18n="build"></button>
    <label><span data-i18n="existingJobs"></span><select id="jobs"><option value="">—</option></select></label>
  </section>

  <section id="progress-box" hidden>
    <h2 data-i18n="s3"></h2>
    <ol id="steps">
      <li data-step="fetch" data-i18n="stepFetch"></li>
      <li data-step="clean" data-i18n="stepClean"></li>
      <li data-step="classify" data-i18n="stepClassify"></li>
      <li data-step="build_dsf" data-i18n="stepDsf"></li>
    </ol>
    <pre id="log"></pre>
  </section>

  <section id="result-box" hidden>
    <h2 data-i18n="s4"></h2>
    <dl id="summary"></dl>
    <label class="check"><input id="show-buildings" type="checkbox" checked> <span data-i18n="showBuildings"></span></label>
    <div class="row">
      <button id="install" class="primary" data-i18n="install"></button>
      <button id="uninstall" class="ghost" data-i18n="uninstall"></button>
    </div>
    <p class="hint" data-i18n="installHint"></p>
  </section>

  <section id="edit-box" hidden>
    <h2 data-i18n="s5"></h2>
    <p class="hint" data-i18n="editHint"></p>
    <div id="edit-form" hidden>
      <p id="edit-title"></p>
      <label><span data-i18n="editAction"></span>
        <select id="edit-action">
          <option value="keep" data-i18n="actionKeep"></option>
          <option value="delete" data-i18n="actionDelete"></option>
          <option value="model" data-i18n="actionModel"></option>
        </select>
      </label>
      <div id="edit-keep">
        <label><span data-i18n="editHeight"></span><input id="edit-height" type="number" min="1" max="350" step="0.5"></label>
        <label><span data-i18n="editStyle"></span>
          <select id="edit-style">
            <option value="" data-i18n="styleAuto"></option>
            <option value="glass" data-i18n="styleGlass"></option>
            <option value="modern" data-i18n="styleModern"></option>
            <option value="classic" data-i18n="styleClassic"></option>
            <option value="universal" data-i18n="styleUniversal"></option>
          </select>
        </label>
      </div>
      <div id="edit-model" hidden>
        <label><span data-i18n="modelPath"></span><input id="edit-model-path" list="model-files" placeholder="eureka/eureka.obj"></label>
        <datalist id="model-files"></datalist>
        <p class="hint" id="models-hint"></p>
        <div class="row three">
          <label><span data-i18n="modelHeading"></span><input id="edit-heading" type="number" step="1" value="0"></label>
          <label><span data-i18n="modelEast"></span><input id="edit-east" type="number" step="0.5" value="0"></label>
          <label><span data-i18n="modelNorth"></span><input id="edit-north" type="number" step="0.5" value="0"></label>
        </div>
      </div>
      <div class="row">
        <button id="edit-save" class="primary" data-i18n="editSave"></button>
        <button id="edit-reset" class="ghost" data-i18n="editReset"></button>
      </div>
      <button id="edit-reference" class="ghost" data-i18n="editReference"></button>
      <p class="hint" data-i18n="referenceHint"></p>
    </div>
    <p id="edit-count"></p>
    <button id="apply-edits" class="primary" data-i18n="applyEdits"></button>
  </section>

  <p id="message" role="status"></p>
  <footer data-i18n="footer"></footer>
</aside>
<main id="map"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<script src="/static/i18n.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
